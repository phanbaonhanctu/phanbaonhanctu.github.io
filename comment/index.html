<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Code Comment Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="index.css">

</head>

<body>

    <nav class="navbar navbar-dark bg-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="../">

                ⚡ Dev Toolbox

            </a>

            <a href="../" class="btn btn-outline-light">

                ← Home

            </a>

        </div>

    </nav>

    <div class="container-fluid py-4">

        <div class="card shadow-lg">

            <div class="card-body">

                <h2 class="mb-4">

                    💬 Code Comment Generator

                </h2>

                <div class="row">

                    <div class="col-md-3">

                        <label class="form-label">

                            Package

                        </label>

                        <select id="package" class="form-select">

                            <option>p2fsl</option>
                            <option>p2fkn</option>
                            <option>p2fbu</option>
                            <option>p2fdi</option>
                            <option selected>p2fsa</option>
                            <option>p2fst</option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">

                            Action

                        </label>

                        <select id="action" class="form-select">

                            <option>ADD</option>
                            <option>MOD</option>
                            <option>DEL</option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Ticket / Description

                        </label>

                        <input type="text" id="ticket" class="form-control" placeholder="">

                    </div>

                </div>

                <div class="mt-4">

                    <label class="form-label">

                        Source Code

                    </label>

                    <textarea id="sourceCode" class="form-control editor" placeholder=""></textarea>

                </div>

                <div class="mt-4 d-flex gap-2">

                    <button id="generateBtn" class="btn btn-success">

                        Generate

                    </button>

                    <button id="copyBtn" class="btn btn-primary">

                        Copy

                    </button>

                    <button id="clearBtn" class="btn btn-danger">

                        Clear

                    </button>

                </div>

                <div class="mt-4">

                    <label class="form-label">

                        Result

                    </label>

                    <textarea id="result" class="form-control editor"></textarea>

                </div>

            </div>

        </div>

    </div>

    <script src="index.js"></script>

</body>

</html>
