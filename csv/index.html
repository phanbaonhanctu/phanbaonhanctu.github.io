<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSV Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../">⚡ Dev Toolbox</a>
            <a href="../" class="btn btn-outline-light">← Home</a>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="card shadow-lg">
            <div class="card-body">
                <div class="toolbar">
                    <input type="file" id="fileInput" accept=".csv,.txt" class="form-control">

                    <select id="inputEncoding" class="form-select" title="Encoding dùng để ĐỌC file">
                        <option value="AUTO" selected>Mở file: tự nhận diện</option>
                        <option value="UTF8">Mở file: UTF8</option>
                        <option value="SJIS">Mở file: Shift-JIS</option>
                        <option value="EUCJP">Mở file: EUC-JP</option>
                    </select>

                    <select id="outputEncoding" class="form-select" title="Encoding dùng để TẢI file về">
                        <option value="UTF8">Tải về: UTF8</option>
                        <option value="UTF8_BOM">Tải về: UTF8-BOM</option>
                        <option value="SJIS" selected>Tải về: Shift-JIS</option>
                        <option value="EUCJP">Tải về: EUC-JP</option>
                    </select>

                    <input id="searchInput" class="form-control" placeholder="Search...">

                    <button id="downloadBtn" class="btn btn-success" disabled>Download</button>
                    <button id="clearBtn" class="btn btn-danger" disabled>Clear</button>
                </div>

                <div class="toolbar mt-2" id="editToolbar">
                    <button class="btn btn-outline-primary btn-sm" data-action="addRowAbove" disabled>＋ Hàng phía trên</button>
                    <button class="btn btn-outline-primary btn-sm" data-action="addRowBelow" disabled>＋ Hàng phía dưới</button>
                    <button class="btn btn-outline-danger btn-sm" data-action="deleteRow" disabled>✕ Xoá hàng</button>
                    <span class="text-secondary">|</span>
                    <button class="btn btn-outline-primary btn-sm" data-action="addColLeft" disabled>＋ Cột bên trái</button>
                    <button class="btn btn-outline-primary btn-sm" data-action="addColRight" disabled>＋ Cột bên phải</button>
                    <button class="btn btn-outline-danger btn-sm" data-action="deleteCol" disabled>✕ Xoá cột</button>
                    <span class="text-secondary">|</span>
                    <button class="btn btn-outline-secondary btn-sm" data-action="undo" disabled>↶ Hoàn tác</button>
                    <small class="text-secondary">Click vào một ô để chọn vị trí thêm/xoá (không chọn thì thêm vào cuối)</small>
                </div>

                <div id="warning" class="warning mt-3"></div>
                <div id="stats" class="stats mt-2"></div>
                <div id="tableContainer" class="table-wrapper mt-4"></div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.2.0/encoding.min.js"></script>
    <script src="index.js"></script>

</body>

</html>
