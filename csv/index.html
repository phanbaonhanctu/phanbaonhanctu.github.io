<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CSV Editor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="index.css">

</head>

<body>

    <nav class="navbar navbar-dark bg-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="../">

                ⚡ Dev Toolbox

            </a>

            <a href="../" class="btn btn-outline-light">

                ← Home

            </a>

        </div>

    </nav>

    <div class="container-fluid py-4">

        <div class="card shadow-lg">

            <div class="card-body">

                <h2 class="text-center mb-4">

                    CSV Editor

                </h2>

                <div class="toolbar">

                    <input type="file" id="fileInput" accept=".csv" class="form-control">

                    <input id="searchInput" class="form-control" placeholder="Search...">
                    <select id="encodingSelect" class="form-select">

                        <option value="UTF8">

                            UTF8

                        </option>

                        <option value="UTF8_BOM">

                            UTF8-BOM

                        </option>

                        <option value="SJIS" selected>

                            Shift-JIS

                        </option>

                        <option value="EUCJP">

                            EUC-JP

                        </option>

                    </select>

                    <button id="downloadBtn" class="btn btn-success" disabled>

                        Download

                    </button>

                    <button id="clearBtn" class="btn btn-danger" disabled>

                        Clear

                    </button>

                </div>

                <div id="warning" class="warning mt-3">
                </div>

                <div id="stats" class="stats mt-2">
                </div>

                <div id="tableContainer" class="table-wrapper mt-4">

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.2.0/encoding.min.js"></script>
    <script src="index.js"></script>

</body>

</html>
