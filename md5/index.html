<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../">
                ⚡ Dev Tools
            </a>

            <a href="../" class="btn btn-outline-light">
                ← Home
            </a>

        </div>
    </nav>

    <div class="container py-5">

        <div class="card shadow-lg">

            <div class="card-body p-4">

                <h2 class="mb-4 text-center">
                    MD5 Generator
                </h2>

                <div class="mb-3">

                    <label class="form-label">
                        Input String
                    </label>

                    <textarea id="inputText" class="form-control" rows="5" placeholder="Nhập text..."></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        MD5 Result
                    </label>

                    <textarea id="result" class="form-control" rows="3" readonly></textarea>

                </div>

                <button id="copyBtn" class="btn btn-primary w-100">

                    Copy MD5
                </button>

                <div id="status" class="mt-3 text-success fw-bold text-center">
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>

    <script src="index.js"></script>

</body>

</html>
