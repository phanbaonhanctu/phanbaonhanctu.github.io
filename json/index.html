<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>JSON Formatter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="../">

                ⚡ Dev Toolbox

            </a>

            <a href="../" class="btn btn-outline-light">

                ← Home

            </a>

        </div>

    </nav>

    <div class="container py-4">

        <div class="card shadow-lg">

            <div class="card-body">

                <h2 class="mb-4 text-center">

                    JSON Formatter

                </h2>

                <div class="row g-4">

                    <div class="col-lg-6">

                        <label class="form-label">

                            Input JSON

                        </label>

                        <textarea id="inputJson" class="form-control code-area" placeholder='{"name":"Sky"}'></textarea>

                    </div>

                    <div class="col-lg-6">

                        <label class="form-label">

                            Formatted Output

                        </label>

                        <textarea id="outputJson" class="form-control code-area" readonly></textarea>

                    </div>

                </div>

                <div class="d-flex gap-2 flex-wrap mt-4">

                    <button id="copyBtn" class="btn btn-primary">

                        Copy

                    </button>

                    <button id="minifyBtn" class="btn btn-warning">

                        Minify

                    </button>

                    <button id="clearBtn" class="btn btn-danger">

                        Clear

                    </button>

                </div>

                <div id="status" class="mt-3 fw-bold">
                </div>

            </div>

        </div>

    </div>

    <script src="index.js"></script>

</body>

</html>
