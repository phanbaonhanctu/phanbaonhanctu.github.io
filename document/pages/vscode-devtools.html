<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tóm tắt VS Code và Chrome DevTools: thủ thuật và kinh nghiệm</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #fff;
      --text: #1d2433;
      --mut: #5d6679;
      --line: #dbe3ec;
      --code: #f1f5f9;
      --c: #0b9a76;
      --cb: #e1f6ef;
      --m: #d97706;
      --mb: #fdf0d9;
      --a: #7c3aed;
      --ab: #efe7fe;
      --pf: #c74634;
      --pfb: #fde8e4;
      --k: #c026d3;
      --s: #0b8a5f;
      --n: #d97706;
      --cm: #8a93a6;
      --p: #2563eb
    }

    @media (prefers-color-scheme:dark) {
      :root {
        --bg: #10161d;
        --card: #18212b;
        --text: #e8eef5;
        --mut: #9aaabd;
        --line: #2b3a4a;
        --code: #0d1319;
        --c: #34d3a8;
        --cb: #12332c;
        --m: #fbbf24;
        --mb: #3a2d10;
        --a: #a78bfa;
        --ab: #2a2150;
        --pf: #fb7a65;
        --pfb: #3d1b16;
        --k: #f0abfc;
        --s: #6ee7b7;
        --n: #fbbf24;
        --cm: #6f8096;
        --p: #7dd3fc
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, "Segoe UI", Roboto, sans-serif
    }

    header {
      background: linear-gradient(100deg, #007acc, #1a73e8 55%, #ea4335);
      color: #fff;
      padding: 28px 20px 22px
    }

    header h1 {
      margin: 0 0 4px;
      font-size: clamp(24px, 4vw, 36px)
    }

    header p {
      margin: 0;
      opacity: .95
    }

    .bar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .bar button,
    .bar input {
      font: inherit;
      font-size: 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 5px 14px
    }

    .bar button {
      cursor: pointer
    }

    .bar button.on {
      border-color: transparent;
      color: #fff;
      background: #c74634
    }

    .bar button[data-l=c].on {
      background: var(--c);
      color: #06231b
    }

    .bar button[data-l=m].on {
      background: var(--m);
      color: #2b1a00
    }

    .bar button[data-l=a].on {
      background: var(--a)
    }

    .bar button[data-l=p].on {
      background: var(--pf);
      color: #fff
    }

    .bar input {
      flex: 1;
      min-width: 140px;
      max-width: 280px;
      margin-left: auto
    }

    .wrap {
      display: flex;
      gap: 24px;
      max-width: 1150px;
      margin: 0 auto;
      padding: 20px 16px
    }

    aside {
      width: 215px;
      flex: none;
      position: sticky;
      top: 64px;
      align-self: flex-start;
      max-height: calc(100vh - 80px);
      overflow: auto;
      font-size: 14px
    }

    aside h4 {
      margin: 12px 0 4px;
      font-size: 14px
    }

    aside a {
      display: block;
      padding: 3px 8px;
      color: var(--text);
      text-decoration: none;
      border-radius: 6px;
      border-left: 3px solid var(--l)
    }

    aside a:hover {
      background: var(--card)
    }

    main {
      flex: 1;
      min-width: 0
    }

    .lvl {
      margin: 26px 0 12px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      background: var(--lb);
      color: var(--l)
    }

    .lvl small {
      display: block;
      font-weight: 400;
      font-size: 14px;
      color: var(--mut)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 6px solid var(--l);
      border-radius: 10px;
      padding: 14px 18px;
      margin: 0 0 14px
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 18px;
      color: var(--l)
    }

    .card p {
      margin: 4px 0 8px;
      color: var(--mut)
    }

    .tip {
      background: var(--lb);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 8px 0 0;
      font-size: 14px
    }

    code {
      font-family: ui-monospace, Consolas, Menlo, monospace
    }

    .cb {
      position: relative;
      margin: 8px 0 0
    }

    pre {
      margin: 0;
      padding: 12px 14px;
      background: var(--code);
      border-radius: 8px;
      overflow-x: auto;
      font: 13.5px/1.55 ui-monospace, Consolas, Menlo, monospace
    }

    pre b {
      font-weight: 400;
      color: var(--k)
    }

    pre i {
      font-style: normal;
      color: var(--s)
    }

    pre u {
      text-decoration: none;
      color: var(--n)
    }

    pre em {
      font-style: normal;
      color: var(--cm)
    }

    pre s {
      text-decoration: none;
      color: var(--p)
    }

    .cp {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--mut);
      border-radius: 6px;
      padding: 1px 8px;
      cursor: pointer
    }

    .p {
      --l: var(--pf);
      --lb: var(--pfb)
    }

    .c {
      --l: var(--c);
      --lb: var(--cb)
    }

    .m {
      --l: var(--m);
      --lb: var(--mb)
    }

    .a {
      --l: var(--a);
      --lb: var(--ab)
    }

    .hide {
      display: none
    }

    @media (max-width:860px) {
      aside {
        display: none
      }
    }
  </style>
</head>
